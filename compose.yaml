services:
  foci-trace:
    build: .
    ports:
      - "8080:8080"
    environment:
      FOCI_PORT: "8080"
      FOCI_DATA_DIR: /app/data
      FOCI_UPLOAD_DIR: /app/uploads
      FOCI_COOKIE_SECURE: "false"
    volumes:
      - foci-data:/app/data
      - foci-uploads:/app/uploads
volumes:
  foci-data:
  foci-uploads:
